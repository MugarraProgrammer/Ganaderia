spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: ganaderia-api
          uri: lb://ganaderia
          predicates:
            - Path=/api/**
        - id: ganaderia-swagger
          uri: lb://ganaderia
          predicates:
            - Path=/swagger-ui/**
        - id: ganaderia-openapi
          uri: lb://ganaderia
          predicates:
            - Path=/v3/api-docs/**
      forwarded:
        enabled: false

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info
