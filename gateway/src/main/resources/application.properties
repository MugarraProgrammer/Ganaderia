server.port=8081
spring.application.name=gateway

spring.cloud.gateway.routes[0].id=ganaderia-api
spring.cloud.gateway.routes[0].uri=http://localhost:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**

spring.cloud.gateway.routes[1].id=ganaderia-swagger
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/swagger-ui/**

spring.cloud.gateway.routes[2].id=ganaderia-openapi
spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/v3/api-docs/**

management.endpoints.web.exposure.include=health,info
spring.cloud.gateway.forwarded.enabled=false